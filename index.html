    <script>
      (function() {
        try {
          const raw = localStorage.getItem('waqto_settings_v1');
          const settings = raw ? JSON.parse(raw) : null;
          const theme = settings ? settings.theme : 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          const appSize = settings && settings.arabicFontSize ? settings.arabicFontSize : 'normal';
          document.documentElement.setAttribute('data-app-size', appSize);
          if (appSize === 'xlarge') {
            document.documentElement.style.fontSize = '20.75px';
          } else if (appSize === 'large') {
            document.documentElement.style.fontSize = '18.25px';
          } else {
            document.documentElement.style.fontSize = '16px';
          }
          if ('serviceWorker' in navigator && (location.hostname.includes('run.app') || location.hostname === 'localhost')) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
