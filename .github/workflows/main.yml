name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: bun install
      - run: bun run build

      # রিপোর android ফোল্ডার অসম্পূর্ণ, তাই নতুন করে বানানো হয়। আগে আইকন-ছবি সরিয়ে রাখা হয়
      - name: Save icons
        run: |
          mkdir -p /tmp/keep
          cp -r android/app/src/main/res /tmp/keep/res

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      # আইকন ফিরিয়ে আনা এবং নতুন প্রজেক্টে যে পারমিশনগুলো থাকে না সেগুলো যোগ করা
      - name: Restore icons and add permissions
        run: |
          R=android/app/src/main/res
          for d in /tmp/keep/res/mipmap-* /tmp/keep/res/drawable-port-* /tmp/keep/res/drawable-land-*; do
            if [ -d "$d" ]; then
              rm -rf "$R/$(basename "$d")"
              cp -r "$d" "$R/"
            fi
          done
          if [ -f /tmp/keep/res/drawable/splash.png ]; then
            cp /tmp/keep/res/drawable/splash.png "$R/drawable/splash.png"
          fi
          mkdir -p "$R/raw"
          cp public/audio/*.mp3 "$R/raw/"
          ls -la "$R/raw/"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#134e3a</color>\n</resources>\n' > "$R/values/ic_launcher_background.xml"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep "uses-permission" android/app/src/main/AndroidManifest.xml

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
